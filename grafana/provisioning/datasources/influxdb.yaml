# Grafana usa el nombre del servicio Docker para encontrar InfluxDB.
apiVersion: 1
datasources:
  - name: TA3 - InfluxDB
    uid: ta3-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: $INFLUX_BUCKET
      timeInterval: 10s
    secureJsonData:
      token: $INFLUX_TOKEN
